name: Keep Supabase Alive WC
on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET 'https://syquxajsdxtbuizqmjad.supabase.co/rest/v1/products?select=id&limit=1' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"